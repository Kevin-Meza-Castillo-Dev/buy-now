name: ci
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Fase 1: lint, tipos y pruebas unitarias. Los servicios (Postgres, Redis, Kafka),
# las pruebas de integración y la imagen Docker entran en la Fase 2, como está en
# docs/plan-de-ci-cd.md.
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run formato:revisar
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
